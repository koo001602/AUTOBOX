# AutoBox Mosquitto Bridge Configuration
# 라즈베리파이 → EC2 브릿지 설정
#
# 설치 위치: /etc/mosquitto/conf.d/bridge.conf
# 
# 설정 후 Mosquitto 재시작:
#   sudo systemctl restart mosquitto

# ===========================================
# 로컬 브로커 설정
# ===========================================
# 로컬 디바이스(오린 나노 등)가 연결할 포트
listener 1883 0.0.0.0
allow_anonymous true

# ===========================================
# EC2 브릿지 연결 설정
# ===========================================
connection bridge-to-ec2

# EC2 MQTT 브로커 주소 (TLS 포트)
# TODO: 실제 EC2 IP로 변경하세요
address 43.201.254.235:8883

# 인증 정보
remote_username raspberry-pi
remote_password YOUR_PASSWORD_HERE

# ===========================================
# TLS 설정
# ===========================================
bridge_cafile /home/pi/autobox/certs/ca.crt
# 클라이언트 인증서 (선택사항)
# bridge_certfile /home/pi/autobox/certs/client.crt
# bridge_keyfile /home/pi/autobox/certs/client.key

# TLS 버전
bridge_tls_version tlsv1.2

# 호스트명 검증 (자체서명 인증서 사용 시 false)
bridge_insecure true

# ===========================================
# 토픽 브릿지 설정
# ===========================================
# 형식: topic <pattern> [direction] [QoS] [local-prefix] [remote-prefix]
# direction: out = 로컬→원격, in = 원격→로컬, both = 양방향

# 센서 데이터: 라즈베리파이 → EC2
topic sensor/# out 1 autobox/ autobox/

# 디바이스 상태: 라즈베리파이 → EC2
topic device/# out 1 autobox/ autobox/

# 알림: 라즈베리파이 → EC2
topic alert/# out 1 autobox/ autobox/

# 카메라 감지: 라즈베리파이 → EC2
topic camera/# out 1 autobox/ autobox/

# 명령: EC2 → 라즈베리파이
topic command/# in 1 autobox/ autobox/

# ===========================================
# 연결 설정
# ===========================================
# 재연결 간격 (초)
restart_timeout 10

# 연결 유지 간격 (초)
keepalive_interval 60

# 클린 세션
cleansession true

# 연결 알림 토픽 (선택사항)
notifications true
notification_topic autobox/bridge/status

# ===========================================
# QoS 설정
# ===========================================
# 브릿지 기본 QoS
bridge_protocol_version mqttv311

# ===========================================
# 로깅
# ===========================================
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
