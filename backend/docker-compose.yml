# AutoBox 전체 스택 Docker Compose 설정
# 사용법: docker-compose up -d

version: '3.8'

services:
  # MySQL 데이터베이스
  mysql:
    image: mysql:8.0
    container_name: autobox-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autobox
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - autobox-mysql-data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autobox-network

  # FastAPI 백엔드 서버
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autobox-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/autobox
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: "true"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:80"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - autobox-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  autobox-mysql-data:
    name: autobox-mysql-data

networks:
  autobox-network:
    name: autobox-network
    driver: bridge
