# AutoBox Full Stack Docker Compose
# Usage: cd backend && docker-compose up -d --build

services:
  # MQTT Broker (Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: autobox-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"   # Internal (non-TLS) - localhost only in production
      - "8883:8883"   # External (TLS) - for Raspberry Pi connection
    volumes:
      - ./mqtt/config:/mosquitto/config:ro
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log
      - ./mqtt/certs:/mosquitto/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "echo 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - autobox-network

  # MySQL Database (optional - use external DB in production)
  mysql:
    image: mysql:8.0
    container_name: autobox-mysql
    restart: unless-stopped
    profiles:
      - with-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-autobox}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - autobox-mysql-data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autobox-network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autobox-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://S14P11A403:1UB5b1SMZQ@ssafy-mysql-db.mysql.database.azure.com:3306/S14P11A403?charset=utf8mb4}
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://frontend}
      # MQTT Configuration
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-autobox}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-autobox-backend}
      MQTT_USERNAME: ${MQTT_USERNAME:-backend}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - autobox-network

  # Vue.js Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    container_name: autobox-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - autobox-network

volumes:
  autobox-mysql-data:
    name: autobox-mysql-data

networks:
  autobox-network:
    name: autobox-network
    driver: bridge
